       1. 根目錄 CSS 變數定義 (Theme Design Tokens)
       ---------------------------------------------------- */
    :root {
      --bg-main: #0F1115;
      --card-bg: #161920;
      --card-border: rgba(51, 65, 85, 0.8);
      --text-primary: #F1F5F9;
      --text-muted: #94A3B8;
      --inner-box-bg: rgba(30, 41, 59, 0.6);
    }

    body.light-mode {
      --bg-main: #F1F5F9;
      --card-bg: #FFFFFF;
      --card-border: #94A3B8;
      --text-primary: #020617;
      --text-muted: #334155;
      --inner-box-bg: #E2E8F0;
    }

    /* ----------------------------------------------------
       2. 全域基礎樣式
       ---------------------------------------------------- */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: var(--bg-main);
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ----------------------------------------------------
       3. 通用卡片與互動元件
       ---------------------------------------------------- */
    .touch-card {
      background-color: var(--card-bg) !important;
      border-color: var(--card-border) !important;
      color: var(--text-primary) !important;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.3s ease;
      touch-action: pan-y;
    }

    body.light-mode .touch-card {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    /* ----------------------------------------------------
       4. Light Mode 頂部導航與表單/Sheet 適配
       ---------------------------------------------------- */
    body.light-mode header,
    body.light-mode nav {
      background-color: rgba(248, 250, 252, 0.9) !important;
      border-color: #CBD5E1 !important;
    }

    body.light-mode [id*="modal-sheet"] {
      background-color: #FFFFFF !important;
      border-color: #CBD5E1 !important;

    }

    body.light-mode header button#theme-toggle-btn,

       5. Light Mode 結構與文字對比強化 (Bento & Headings)
       ---------------------------------------------------- */
    body.light-mode .bg-slate-800\/60,
    body.light-mode .bg-slate-900 {
      background-color: var(--inner-box-bg) !important;
      border-color: var(--card-border) !important;

    body.light-mode .text-slate-400 { color: #475569 !important; }
    body.light-mode .text-slate-300 { color: #1E293B !important; }

    body.light-mode h2,
    body.light-mode h3,
    body.light-mode .touch-card h2,
    body.light-mode .touch-card h3 {
      color: #020617 !important;
    }

    }

  <script>
    /* ----------------------------------------------------
       1. 戶外強光與日夜模式切換 (CSS Variables Token 驅動)
    ---------------------------------------------------- */
    function toggleThemeMode() {
      const body = document.body;
      const themeIcon = document.getElementById('theme-icon');
      const themeText = document.getElementById('theme-text');
      
      const isLight = body.classList.toggle('light-mode');
      body.classList.toggle('dark', !isLight);

      themeIcon.textContent = isLight ? '☀️' : '🌙';
      themeText.textContent = isLight ? '日間' : '夜間';
      localStorage.setItem('travel_theme_mode', isLight ? 'light' : 'dark');
    }

    // 初始化載入主題設定
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('travel_theme_mode');
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        document.body.classList.remove('dark');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        if (themeIcon) themeIcon.textContent = '☀️';
        if (themeText) themeText.textContent = '日間';
      }
    });

    /* ----------------------------------------------------
       2. 手勢操作優化 (Pointer Events: 右滑完成 / 左滑防誤觸)
    ---------------------------------------------------- */
    let startX = 0, startY = 0, currentCard = null;

    document.addEventListener('pointerdown', (e) => {
      const card = e.target.closest('.touch-card');
      if (!card) return;
      startX = e.clientX;
      startY = e.clientY;
      currentCard = card;
    });

    document.addEventListener('pointerup', (e) => {
      if (!currentCard) return;

      const diffX = e.clientX - startX;
      const diffY = e.clientY - startY;

      // 門檻：水平移動須大於 70px 且水平偏移大於垂直偏移 (避免干擾頁面上下滾動)
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 70) {
        if (diffX > 0) {
          // 👉 右滑 (Swipe Right)：將該卡片標記為已造訪 / 完成
          currentCard.style.transform = 'translateX(40px)';
          currentCard.style.opacity = '0.4';
          currentCard.classList.add('line-through', 'grayscale');
          
          // 帶有平滑下沉動畫
          setTimeout(() => {
            currentCard.style.transform = 'translateY(10px)';
          }, 150);
        } else {
          // 👈 左滑 (Swipe Left)：故意留白不執行任何動作，徹底避免上下滾動時誤觸亂跳
          currentCard.style.transform = '';
        }
      }

      currentCard = null;
    });

    /* ----------------------------------------------------
       3. 底部浮動 Sticky Header 滾動視口動態追蹤 Logic
    ---------------------------------------------------- */
    window.addEventListener('scroll', () => {
      // 🛡️ 防禦性判斷：如果 Layer 2 彈窗正在開啟（overlay 沒有 hidden），直接略過滾動監聽
      const modalOverlay = document.getElementById('modal-overlay');
      if (modalOverlay && !modalOverlay.classList.contains('hidden')) return;

      const stickyHeader = document.getElementById('sticky-time-header');
      if (!stickyHeader) return;

      // 當滾動距離超過 150px 時顯示底部 Sticky Bar
      if (window.scrollY > 150) {
        stickyHeader.classList.remove('translate-y-20', 'opacity-0');
        stickyHeader.classList.add('translate-y-0', 'opacity-100');

        const cards = document.querySelectorAll('#timeline-container .touch-card');
        let currentActiveCard = null;
        const triggerLine = 130; // Day Bar 底部的像素位置

        // 尋找當前剛好被 Day Bar 覆蓋或正在頂部的卡片
        for (let i = 0; i < cards.length; i++) {
          const card = cards[i];
          const rect = card.getBoundingClientRect();
  
        // 當卡片頂端小於或等於觸發線（代表已經碰到或被 Day Bar 蓋住）
        // 且卡片的底部還在觸發線下方（代表它還在畫面中）
        if (rect.top <= triggerLine && rect.bottom > triggerLine) {
          currentActiveCard = card;
          break; // 找到第一張剛好頂住 Day Bar 的卡片就立即鎖定，不再往下找
        }
      }

        if (currentActiveCard) {
          // 從該卡片 DOM 擷取名稱與時間
          const titleEl = currentActiveCard.querySelector('h2, h3');
          const parentSlot = currentActiveCard.closest('.flex');
          const timeEl = parentSlot ? parentSlot.querySelector('span[style*="tabular-nums"]') : null;

          const timeText = timeEl ? timeEl.textContent.trim() : '進行中';
          const titleText = titleEl ? titleEl.textContent.trim() : '行程';

          const timeBadge = document.getElementById('sticky-time-badge');
          const titleBadge = document.getElementById('sticky-title-badge');
          if (timeBadge) timeBadge.textContent = timeText;
          if (titleBadge) titleBadge.textContent = titleText;
        }
      } else {
        stickyHeader.classList.add('translate-y-20', 'opacity-0');
        stickyHeader.classList.remove('translate-y-0', 'opacity-100');
      }
    });
  </script>
