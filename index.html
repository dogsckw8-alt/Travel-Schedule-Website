<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>東京 7 日 6 夜行程手札</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0F1115',       // 溫潤深灰沉浸底色
              surface: '#161920',  // 卡片材質
              elevated: '#1F2430', // 高亮抬升材質
              gold: '#F59E0B',     // 香檳金點綴
              goldLight: '#FBBF24',
              text: '#F1F5F9',     // 柔和米白主字
              muted: '#94A3B8'     // 次要灰色字
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #0F1115;
    }
    .touch-card {
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s ease;
    }
    .touch-card:active {
      transform: scale(0.97);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-brand-bg text-brand-text min-h-screen pb-16 select-none antialiased">

  <!-- 頂部 Contextual Header -->
  <header class="sticky top-0 bg-[#0F1115]/90 backdrop-blur-xl z-30 px-4 py-3.5 border-b border-slate-800/80 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-2">
      <span class="text-xl">⛩️</span>
      <h1 class="text-lg font-black text-brand-gold tracking-wide">東京冬日行程手札</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="fetchLatestData()" class="flex items-center gap-2 bg-brand-surface border border-slate-700/60 px-3 py-1.5 rounded-full active:scale-95 transition shadow-inner">
        <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="sync-text" class="text-xs text-brand-muted font-extrabold tracking-wider">已同步</span>
      </button>
    </div>
  </header>

  <!-- 動態 Day 膠囊導航列 -->
  <nav class="sticky top-[57px] bg-[#0F1115]/90 backdrop-blur-xl z-20 px-3 py-2.5 border-b border-slate-800/60 shadow-md">
    <div id="day-tabs" class="flex gap-2.5 overflow-x-auto no-scrollbar px-1">
      <!-- 由 JS 動態生成 Day 膠囊按鈕 -->
    </div>
  </nav>

  <!-- 第一層：貫穿式時間軸與內容主體 -->
  <main class="max-w-md mx-auto px-4 pt-6 relative">
    <!-- 發光時間軸連線 -->
    <div class="absolute left-[39px] top-6 bottom-6 w-0.5 bg-gradient-to-b from-brand-gold/50 via-slate-700 to-slate-800 z-0"></div>
    <div id="timeline-container" class="space-y-6 relative z-10">
      <!-- 由 JS 動態生成行程卡片與體能看板 -->
    </div>
  </main>

  <!-- 第二層：Bottom Sheet Modal (景點/餐廳/交通詳情) -->
  <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-40 flex flex-col justify-end hidden opacity-0 transition-opacity duration-300" onclick="closeModal(event)">
    <div id="modal-sheet" class="bg-brand-surface border-t border-slate-700/80 rounded-t-[2.5rem] max-h-[88vh] flex flex-col overflow-hidden transform translate-y-full transition-transform duration-300 ease-out shadow-2xl" onclick="event.stopPropagation()">

      <!-- Modal 頂部控制列與抓手 -->
      <div class="px-5 pt-3 pb-2 flex justify-between items-center border-b border-slate-800/80 flex-shrink-0">
        <div id="modal-back-btn-container"></div>
        <div class="w-10 h-1.5 bg-slate-700/80 rounded-full mx-auto"></div>
        <button onclick="closeModalDirect()" class="text-slate-400 hover:text-white p-1 text-2xl font-bold leading-none">✕</button>
      </div>

      <!-- 可滾動內容主體 -->
      <div class="p-5 space-y-5 overflow-y-auto flex-1 no-scrollbar">
        <!-- Header & 大圖 Banner -->
        <div id="modal-header" class="space-y-3"></div>

        <!-- 核心資訊網格 -->
        <div id="modal-grid" class="grid grid-cols-2 gap-3 text-slate-200"></div>

        <!-- 轉乘/行程分段明細 (交通專用卡片) -->
        <div id="modal-transit-steps" class="space-y-4 hidden"></div>

        <!-- 提醒、SubSpots 微型時間軸、順遊下一站區塊 -->
        <div id="modal-alerts" class="space-y-4"></div>
      </div>

      <!-- 吸底導航與動作按鈕 -->
      <div id="modal-actions" class="p-4 bg-brand-surface border-t border-slate-800 flex gap-3 z-10 flex-shrink-0"></div>
    </div>
  </div>

  <!-- 第三層：Lightbox 全螢幕圖片/時刻表預覽 Modal -->
  <div id="lightbox-overlay" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200 p-4" onclick="closeLightbox()">
    <button onclick="closeLightbox()" class="absolute top-5 right-5 text-slate-400 hover:text-white text-2xl font-black z-50 p-2 bg-brand-surface/80 rounded-full w-11 h-11 flex items-center justify-center border border-slate-700">✕</button>
    <div class="relative max-w-full max-h-full flex items-center justify-center" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="圖片預覽" class="max-w-full max-h-[85vh] rounded-2xl object-contain shadow-2xl transform scale-95 transition-transform duration-200 border border-slate-800">
      <div id="lightbox-caption" class="absolute bottom-[-2.5rem] text-center text-xs font-black text-slate-300 bg-brand-surface/90 px-4 py-1.5 rounded-full border border-slate-700 shadow-md"></div>
    </div>
  </div>


  <script>
    // 🧪 模擬測試資料 (Mock Data)
    window.mockTravelData = {
      "status": "success",
      "updatedAt": "2026/12/13 下午 2:00:00",
      "schedule": {
        "days": ["2026-12-13", "2026-12-14", "2026-12-15"],
        "timeline": {
          "2026-12-13": {
            "items": [
              { "time": "09:00", "name": "淺草寺 | 雷門與仲見世通", "duration": 120, "departure": "11:00", "notice": "09:00開店 | 建議早訪避開人潮" },
              { "time": "11:00➔11:15", "name": "淺草➔上野", "duration": 15, "departure": "11:15", "notice": "" },
              { "time": "11:15", "name": "上野恩賜公園", "duration": 90, "departure": "12:45", "notice": "賞景散步" },
              { "time": "12:45➔13:00", "name": "上野➔秋葉原", "duration": 15, "departure": "13:00", "notice": "" },
              { "time": "13:00", "name": "鳥貴族 秋葉原店", "duration": 90, "departure": "14:30", "notice": "已預約午餐" }
            ],
            "fitness": {
              "status": "🟢",
              "summaryText": "🟢 輕鬆漫遊 | 預估步數: 5,420 步 | 總步行: 38 分鐘 (2.6 km)"
            }
          },
          "2026-12-14": {
            "items": [
              { "time": "10:00", "name": "築地場外市場", "duration": 100, "departure": "11:40", "notice": "🔥 建議 10:00 排隊品嚐海鮮丼" },
              { "time": "11:40➔12:00", "name": "築地➔銀座", "duration": 20, "departure": "12:00", "notice": "" },
              { "time": "12:00", "name": "銀座商圈散策", "duration": 150, "departure": "14:30", "notice": "步行購物" }
            ],
            "fitness": {
              "status": "🟡",
              "summaryText": "🟡 中度負荷 | 預估步數: 8,900 步 | 總步行: 65 分鐘 (4.5 km)"
            }
          },
          "2026-12-15": {
            "items": [
              { "time": "08:30", "name": "箱根湯本溫泉旅館", "duration": 120, "departure": "10:30", "notice": "退房並寄放行李" }
            ],
            "fitness": {
              "status": "🟢",
              "summaryText": "🟢 輕鬆漫遊 | 預估步數: 2,100 步 | 總步行: 15 分鐘 (1.0 km)"
            }
          }
        }
      }
    };

    let currentSelectedDay = null;

    // 初始化渲染
    function initApp() {
      const data = window.mockTravelData;
      if (!data || !data.schedule) return;

      renderTabs(data.schedule.days);
      if (data.schedule.days.length > 0) {
        switchDay(data.schedule.days[0]);
      }
    }

    // 渲染上方日期分頁膠囊
    function renderTabs(days) {
      const container = document.getElementById('day-tabs');
      container.innerHTML = days.map((day, index) => `
        <button onclick="switchDay('${day}')" id="tab-${day}" class="px-4 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${index === 0 ? 'bg-brand-gold text-brand-bg shadow-md' : 'bg-brand-surface text-brand-muted border border-slate-800'}">
          Day ${index + 1} (${day})
        </button>
      `).join('');
    }

    // 切換顯示特定日期的行程
    function switchDay(day) {
      currentSelectedDay = day;
      
      // 更新 Tab 樣式
      const data = window.mockTravelData;
      data.schedule.days.forEach(d => {
        const btn = document.getElementById(`tab-${d}`);
        if (btn) {
          if (d === day) {
            btn.className = "px-4 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap bg-brand-gold text-brand-bg shadow-md";
          } else {
            btn.className = "px-4 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap bg-brand-surface text-brand-muted border border-slate-800";
          }
        }
      });

      // 渲染該日時間軸與體能看板
      const dayData = data.schedule.timeline[day];
      const container = document.getElementById('timeline-container');
      
      if (!dayData) {
        container.innerHTML = `<div class="text-center text-brand-muted py-10">本日無行程資料</div>`;
        return;
      }

      let html = '';
      
      // 渲染行程卡片列表
      dayData.items.forEach((item, idx) => {
        html += `
          <div class="flex items-start gap-4 relative">
            <div class="w-12 text-right flex-shrink-0 pt-1">
              <span class="text-xs font-extrabold text-brand-gold">${item.time}</span>
            </div>
            <div class="w-4 h-4 rounded-full bg-brand-elevated border-2 border-brand-gold flex-shrink-0 mt-1.5 z-10 shadow"></div>
            <div class="flex-1 bg-brand-surface border border-slate-800/80 rounded-2xl p-4 shadow-md touch-card">
              <h3 class="font-bold text-sm text-brand-text mb-1">${item.name}</h3>
              <p class="text-xs text-brand-muted mb-2">預計停留：${item.duration} 分鐘 | 離開：${item.departure}</p>
              ${item.notice ? `<div class="text-xs bg-brand-bg/50 px-2.5 py-1.5 rounded-lg text-slate-300 border border-slate-800">${item.notice}</div>` : ''}
            </div>
          </div>
        `;
      });

      // 渲染體能看板
      if (dayData.fitness) {
        html += `
          <div class="mt-6 bg-brand-surface border border-slate-800 rounded-2xl p-4 text-center shadow-md">
            <p class="text-xs font-bold text-brand-muted">${dayData.fitness.summaryText}</p>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // 同步按鈕點擊觸發
    function fetchLatestData() {
      const dot = document.getElementById('sync-dot');
      const text = document.getElementById('sync-text');
      text.textContent = "同步中...";
      dot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-spin";
      
      setTimeout(() => {
        text.textContent = "已同步";
        dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
        if (currentSelectedDay) switchDay(currentSelectedDay);
      }, 600);
    }

    // Modal 控制函式 (預留)
    function closeModal(event) { if (event.target.id === 'modal-overlay') closeModalDirect(); }
    function closeModalDirect() { document.getElementById('modal-overlay').classList.add('hidden'); }
    function closeLightbox() { document.getElementById('lightbox-overlay').classList.add('hidden'); }

    // 當 DOM 載入完成後自動初始化
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
