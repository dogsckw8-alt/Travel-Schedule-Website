  <script>
    /* ----------------------------------------------------
       ✨ 新增功能 1：戶外強光與日夜模式切換 (Light / Dark Mode)
    ---------------------------------------------------- */
    function toggleThemeMode() {
      const body = document.body;
      const themeIcon = document.getElementById('theme-icon');
      const themeText = document.getElementById('theme-text');
      
      if (body.classList.contains('dark-mode')) {
        body.classList.remove('dark-mode');
        body.classList.add('light-mode');
        themeIcon.textContent = '☀️';
        themeText.textContent = '日間';
        localStorage.setItem('travel_theme_mode', 'light');
      } else {
        body.classList.remove('light-mode');
        body.classList.add('dark-mode');
        themeIcon.textContent = '🌙';
        themeText.textContent = '夜間';
        localStorage.setItem('travel_theme_mode', 'dark');
      }
    }

    // 初始化讀取使用者偏好主題
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('travel_theme_mode');
      if (savedTheme === 'light') {
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        if (themeIcon) themeIcon.textContent = '☀️';
        if (themeText) themeText.textContent = '日間';
      }
    });

    /* ----------------------------------------------------
       ✨ 新增功能 2：手勢操作優化 (右滑完成 / 左滑防誤觸)
    ---------------------------------------------------- */
    document.addEventListener('touchstart', handleTouchStart, false);
    document.addEventListener('touchmove', handleTouchMove, false);

    let xDown = null;
    let yDown = null;
    let activeCard = null;

    function handleTouchStart(evt) {
      const card = evt.target.closest('.touch-card');
      if (!card) return;
      xDown = evt.touches[0].clientX;
      yDown = evt.touches[0].clientY;
      activeCard = card;
    }

    function handleTouchMove(evt) {
      if (!xDown || !yDown || !activeCard) return;

      let xUp = evt.touches[0].clientX;
      let yUp = evt.touches[0].clientY;

      let xDiff = xUp - xDown;
      let yDiff = yUp - yDown;

      // 確保是水平滑動大於垂直滑動，避免干擾上下捲動
      if (Math.abs(xDiff) > Math.abs(yDiff)) {
        if (xDiff > 80) {
          // 👉 右滑 (Swipe Right)：標記為已完成
          activeCard.style.transform = `translateX(${xDiff}px)`;
          activeCard.style.opacity = '0.5';
          activeCard.classList.add('line-through');
          
          setTimeout(() => {
            activeCard.style.transition = 'all 0.3s ease';
            activeCard.style.transform = 'translateY(20px)';
            activeCard.style.opacity = '0.3';
          }, 150);

          xDown = null;
          yDown = null;
          activeCard = null;
        } else if (xDiff < -50) {
          // 👈 左滑 (Swipe Left)：刻意不執行動作，防止長輩誤觸
          xDown = null;
          yDown = null;
        }
      }
    }

    /* ----------------------------------------------------
       ✨ 新增功能 3：頂部釘選時間列 (Sticky Time Headers)
    ---------------------------------------------------- */
    window.addEventListener('scroll', () => {
      const stickyHeader = document.getElementById('sticky-time-header');
      if (!stickyHeader) return;

      if (window.scrollY > 250) {
        stickyHeader.classList.remove('-translate-y-full', 'opacity-0');
        stickyHeader.classList.add('translate-y-0', 'opacity-100');
        
        // 自動抓取當前模擬進行中的項目標題更新到釘選列
        const timeBadge = document.getElementById('sticky-time-badge');
        const titleBadge = document.getElementById('sticky-title-badge');
        if (timeBadge && titleBadge) {
          timeBadge.textContent = "11:15";
          titleBadge.textContent = "上野恩賜公園 (進行中)";
        }
      } else {
        stickyHeader.classList.add('-translate-y-full', 'opacity-0');
        stickyHeader.classList.remove('translate-y-0', 'opacity-100');
      }
    });
  </script>
